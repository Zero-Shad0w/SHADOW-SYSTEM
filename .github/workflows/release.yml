name: Build and publish SHADOW SYSTEM

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'android-native/scripts/**'
      - 'android-native/package.json'
      - 'assets/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract uploaded application archive
        run: |
          set -euo pipefail
          ARCHIVE="source/SHADOW-SYSTEM-v0.10-CLOUD-SYNC.zip"
          test -f "$ARCHIVE" || { echo "::error::Upload the supplied ZIP to $ARCHIVE first."; exit 1; }
          mkdir -p workspace
          unzip -q "$ARCHIVE" -d workspace
          APP="workspace/shadow-system"
          test -f "$APP/server.js" || { echo "::error::The archive does not contain shadow-system/server.js."; exit 1; }
          test -f "$APP/public/app.js" || { echo "::error::The archive does not contain public/app.js."; exit 1; }
          test -f "$APP/public/index.html" || { echo "::error::The archive does not contain public/index.html."; exit 1; }
          test -f "$APP/START-SHADOW-SYSTEM.bat" || { echo "::error::START-SHADOW-SYSTEM.bat is missing."; exit 1; }

      - name: Apply Android improvements to Windows package
        run: |
          set -euo pipefail
          APP="workspace/shadow-system"
          cp -R android-native "$APP/android-native"
          cp -R assets "$APP/assets"
          cd "$APP/android-native"
          npm install --no-audit --no-fund
          node scripts/generate-web-icons.js
          node scripts/patch-windows-ui.js
          cd ../..
          echo "Applied Hunter profile photo, direct programme tutorials, dashboard tutorials, Shadow Monarch theme and selected app icon."

      - name: Check JavaScript syntax
        run: |
          node --check workspace/shadow-system/server.js
          node --check workspace/shadow-system/public/app.js
          node --check workspace/shadow-system/public/service-worker.js

      - name: Package Windows PWA release
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -R workspace/shadow-system dist/shadow-system
          rm -rf dist/shadow-system/data
          mkdir -p dist/shadow-system/data
          printf '%s\n' 'The SQLite database is created automatically on first launch. Keep this folder when updating an existing installation.' > dist/shadow-system/data/README.txt
          cd dist
          zip -r SHADOW-SYSTEM.zip shadow-system
          unzip -t SHADOW-SYSTEM.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-SYSTEM-Windows-Android-PWA
          path: dist/SHADOW-SYSTEM.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES='Windows PWA package for SHADOW SYSTEM. Includes Hunter profile photos, direct active-programme exercise tutorials on the dashboard and programmes page, Shadow Monarch styling, and the selected Hunter portrait as the installed PWA icon. Requires Node.js 22.5 or newer. Stop the existing app before updating, extract over the existing folder, keep the data folder, then run START-SHADOW-SYSTEM.bat.'
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/SHADOW-SYSTEM.zip --clobber
            gh release edit latest --title "SHADOW SYSTEM — Latest Build" --notes "$NOTES"
          else
            gh release create latest dist/SHADOW-SYSTEM.zip --title "SHADOW SYSTEM — Latest Build" --notes "$NOTES" --target "${GITHUB_SHA}"
          fi

  windows-installer:
    name: Build native Windows installer
    runs-on: windows-latest
    needs: build-and-release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract application and apply Windows features
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace
          unzip -q source/SHADOW-SYSTEM-v0.10-CLOUD-SYNC.zip -d workspace
          APP="workspace/shadow-system"
          test -f "$APP/server.js"
          test -f "$APP/public/app.js"
          cp -R android-native "$APP/android-native"
          cp -R assets "$APP/assets"
          cp electron-main.cjs "$APP/electron-main.cjs"
          cp package.json "$APP/package.json"
          cd "$APP/android-native"
          npm install --no-audit --no-fund
          node scripts/generate-web-icons.js
          node scripts/patch-windows-ui.js
          cd ../..
          mkdir -p "$APP/data"
          printf '%s\\n' 'Training database is stored here. Do not delete this folder when updating.' > "$APP/data/README.txt"
          node --check "$APP/server.js"
          node --check "$APP/public/app.js"
          node --check "$APP/electron-main.cjs"

      - name: Install Electron dependencies and build NSIS installer
        shell: bash
        run: |
          set -euo pipefail
          cd workspace/shadow-system
          npm install --no-audit --no-fund
          npm run dist:win
          test -s dist/SHADOW-SYSTEM-Setup-1.0.0.exe

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-SYSTEM-Windows-Installer
          path: workspace/shadow-system/dist/SHADOW-SYSTEM-Setup-1.0.0.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows installer to latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload latest workspace/shadow-system/dist/SHADOW-SYSTEM-Setup-1.0.0.exe --clobber
          gh release edit latest --notes "Windows native desktop installer (NSIS) added. Installs SHADOW SYSTEM as a standalone desktop window with the selected Hunter portrait icon. The app starts its local training server automatically. Also includes Hunter profile photos, direct active-programme tutorials, dashboard tutorials and Shadow Monarch styling. Keep your existing training data folder when updating. Android debug APK remains a separate build artifact."
